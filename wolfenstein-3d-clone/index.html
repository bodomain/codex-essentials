<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iron Keep</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game" width="320" height="200" aria-label="Iron Keep game canvas"></canvas>
      <div id="touch-controls" aria-hidden="true">
        <button data-action="left">◀</button>
        <button data-action="forward">▲</button>
        <button data-action="backward">▼</button>
        <button data-action="right">▶</button>
        <button data-action="shoot">●</button>
        <button data-action="use">◆</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
